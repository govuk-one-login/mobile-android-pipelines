# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]

android-gradle = "9.3.1" # https://developer.android.com/studio/releases/gradle-plugin
android-security-lint = "1.0.4" # https://github.com/google/android-security-lints
buildconfig-gradle = "6.0.10" # https://github.com/gmazzo/gradle-buildconfig-plugin/releases
detekt = "1.23.8" # https://github.com/detekt/detekt/releases
hamcrest = "3.0"
jacoco-tool = "0.8.14" # https://github.com/jacoco/jacoco/releases
junit = "6.1.2" # https://github.com/junit-team/junit5/releases
ktlint-gradle = "14.2.0" # https://github.com/JLLeitschuh/ktlint-gradle/releases
ktlint-cli = "1.8.0" # https://github.com/pinterest/ktlint/releases
kotlin-general = "2.4.21" # https://kotlinlang.org/docs/releases.html#release-details
sonarqube-gradle = "7.5.0.8588" # https://github.com/SonarSource/sonar-scanner-gradle/releases

# Transitive security patches for the build/plugin classpath (via AGP, Kotlin Gradle plugin,
# sonarqube). Not shipped in any app; constrained to patched versions to clear Dependabot CVEs.
guava = "33.7.2-jre" # GHSA-xxph-c9ww-hj94
bouncycastle = "1.85" # GHSA-9pwp-9qqc-pr26, GHSA-qp49-qgx5-5m26
logback = "1.5.34" # GHSA-jhq6-gfmj-v8fx

[libraries]

android-build-tool = { group = "com.android.tools.build", name = "gradle", version.ref = "android-gradle" }
detekt-gradle = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin-general" }
ktlint-gradle = { group = "org.jlleitschuh.gradle", name = "ktlint-gradle", version.ref = "ktlint-gradle" }
sonarqube-gradle = { module = "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin", version.ref = "sonarqube-gradle" }
org-junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
org-junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
org-junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }

org-junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
org-hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }

# Security patches — transitive constraints for the build/plugin classpath (not shipped).
# The bouncycastle group is declared in full so the modules stay version-aligned (mixing
# bcprov with older bcutil/bcpkix causes a runtime error).
patch-guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
patch-logback-core = { group = "ch.qos.logback", name = "logback-core", version.ref = "logback" }
bouncycastle-bcprov = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { group = "org.bouncycastle", name = "bcutil-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version.ref = "bouncycastle" }

[plugins]

buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig-gradle" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube-gradle" }

[bundles]

# bouncycastle modules flagged by Dependabot, constrained as a group so the modules stay
# version-aligned (mixing bcprov with older bcutil/bcpkix causes a runtime error).
tooling-security-bouncycastle = [
  "bouncycastle-bcprov",
  "bouncycastle-bcutil",
  "bouncycastle-bcpkix",
]
