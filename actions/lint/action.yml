name: 'Lint'
description: 'Lint files'

runs:
  using: "composite"
  steps:
    - name: Lint documentation with vale
      run: ./gradlew vale
      shell: bash

    - name: Lint Kotlin with ktlint
      run: ./gradlew ktlintCheck
      shell: bash

    - name: Lint Kotlin with detekt
      run: ./gradlew detekt
      shell: bash

    - name: Lint Android
      run: ./gradlew lint
      shell: bash
