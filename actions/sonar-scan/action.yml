name: 'Run SonarCloud Analysis'
description: 'Runs SonarCloud analysis, uploading results and - if analysis type is PR - failing based on analysis result'
inputs:
  sonar-token:
    description: 'A token for SonarCloud to enable the workflow to read and upload new quality reports.'
    required: true
  pipelines-directory:
    description: 'Pipelines directory'
    required: false
    default: './mobile-android-pipelines'
  working-directory:
    description: 'The working directory for steps in this action'
    required: false
    default: '.'
  version-name:
    description: 'The version name for the build'
    required: false


runs:
  using: "composite"
  steps:
    - name: Determine analysis type
      id: analysis
      run: |
        if [ "${EVENT_NAME}" = "pull_request" ]; then
          echo "analysis-type=PR" >> "$GITHUB_OUTPUT"
        else
          echo "analysis-type=BRANCH" >> "$GITHUB_OUTPUT"
        fi
      env:
        EVENT_NAME: ${{ github.event_name }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Sonar scan
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        PIPELINES_DIRECTORY: ${{ inputs.pipelines-directory }}
        PR_NUMBER: ${{ github.event.number }}
        VERSION_NAME: ${{ inputs.version-name }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        ANALYSIS_TYPE: ${{ steps.analysis.outputs.analysis-type }}
      run: |
        case "${ANALYSIS_TYPE}" in
          "PR")
            REF=$GITHUB_HEAD_REF
            ;;
          "BRANCH")
            REF=$GITHUB_REF_NAME
            ;;
          *)
            REF=""
            ;;
        esac
        ${PIPELINES_DIRECTORY}/scripts/sonar/scan \
          "${ANALYSIS_TYPE}" \
          "$REF" \
          "$PR_NUMBER" \
          "$VERSION_NAME"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # pin@v1.2.1
      if: steps.analysis.outputs.analysis-type == 'PR'
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
      with:
        scanMetadataReportFile: ${{ inputs.working-directory }}/build/sonar/report-task.txt
